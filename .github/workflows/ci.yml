name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Ruff
        run: ruff check app/ tests/

      - name: Ruff format check
        run: ruff format --check app/ tests/

      - name: Mypy
        run: mypy app/

      - name: Unit tests
        run: pytest tests/unit -q --tb=short
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          PAPER_MODE: "true"
          LIVE_TRADING: "false"

      - name: Dependency audit
        run: pip-audit --strict || pip-audit
        continue-on-error: true

  compose-config:
    name: Compose config smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-secret-not-for-prod
          POSTGRES_DB: penny_stocks
          DATABASE_URL: postgresql+asyncpg://ci:ci-secret-not-for-prod@postgres:5432/penny_stocks
          API_KEY: ci-api-key
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate dev overlay
        env:
          POSTGRES_USER: penny
          POSTGRES_PASSWORD: penny-dev-only-change-me
          DATABASE_URL: postgresql+asyncpg://penny:penny-dev-only-change-me@postgres:5432/penny_stocks
          API_KEY: dev-api-key-change-me
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
