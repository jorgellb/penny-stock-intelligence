[project]
name = "penny-stock-intelligence"
version = "0.1.0"
description = "Penny Stock Intelligence Engine - Quantitative scanner for US micro-cap stocks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "pandas>=2.2.0",
    "polars>=1.8.0",
    "numpy>=1.26.0",
    "apscheduler>=3.10.0",
    "python-telegram-bot>=21.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.1",
    "pytz>=2024.1",
    "python-dateutil>=2.9.0",
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "yfinance>=0.2.40",
    "alpha-vantage>=2.3.1",
    "finnhub-python>=1.2.0",
    "sec-edgar-downloader>=1.3.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "faker>=27.0.0",
    "factory-boy>=3.3.0",
    "pip-audit>=2.7.0",
    "aiosqlite>=0.20.0",
]
dashboard = [
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "altair>=5.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["ARG001", "ARG002", "TRY003", "PTH123", "SIM102", "UP035", "UP042", "B008"]
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/providers/ai/__init__.py" = ["E501"]
"tests/unit/test_listings.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
enable_error_code = ["unused-ignore", "attr-defined"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "apscheduler.*", "redis.*", "uvicorn.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`.*:Warning",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.setuptools.packages.find]
include = ["app*", "dashboard*"]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"